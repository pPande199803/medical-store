<div
  class="
    min-h-screen
    bg-[#F5F5F5]
    flex
    items-center
    justify-center
    p-4
  "
>

  <div
    class="
      w-full
      max-w-lg
      bg-white
      rounded-2xl
      border
      border-gray-200
      shadow-sm
      p-8
      sm:p-10
      text-center
    "
  >

    <!-- Logo -->
    <div
      class="
        w-20
        h-20
        mx-auto
        mb-6
        rounded-full
        bg-[#DCFCE7]
        flex
        items-center
        justify-center
      "
    >
      <span class="text-4xl">
        💊
      </span>
    </div>

    <!-- 404 -->
    <h1
      class="
        text-7xl
        sm:text-8xl
        font-bold
        text-[#065F46]
        leading-none
      "
    >
      404
    </h1>

    <!-- Title -->
    <h2
      class="
        mt-5
        text-2xl
        sm:text-3xl
        font-bold
        text-gray-800
      "
    >
      Page Not Found
    </h2>

    <!-- Description -->
    <p
      class="
        mt-3
        text-sm
        sm:text-base
        text-gray-500
        leading-relaxed
        max-w-md
        mx-auto
      "
    >
      Sorry, the page you are looking for doesn't exist
      or may have been moved.
    </p>

    <!-- Buttons -->
    <div
      class="
        mt-7
        flex
        flex-col
        sm:flex-row
        items-center
        justify-center
        gap-3
      "
    >


      <!-- Login -->
      <button
        type="button"
        (click)="goToLogin()"
        class="
          w-full
          sm:w-auto
          px-6
          py-3
          rounded-xl
          border
          border-[#A7F3D0]
          bg-[#F0FDF4]
          text-[#065F46]
          text-sm
          font-semibold
          hover:bg-[#DCFCE7]
          transition
        "
      >
        Login
      </button>

    </div>

    <!-- Footer Text -->
    <p class="mt-8 text-xs text-gray-400">
      Medical-Store
    </p>

  </div>

</div>
